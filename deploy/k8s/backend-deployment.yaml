apiVersion: apps/v1
kind: Deployment
metadata:
  name: openpilot-backend
spec:
  # Single replica required: holds Athena WebSocket ConnectionManager
  # in memory and resets device online flags on startup.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openpilot-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openpilot-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/martinl/openpilot-backend/backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3112
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: openpilot-config
            - secretRef:
                name: openpilot-secrets
          env:
            # Automatically generated by CloudNativePG Cluster `openpilot-db`
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openpilot-db-app
                  key: uri
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: params
              mountPath: /params
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: params
          persistentVolumeClaim:
            claimName: openpilot-params
        - name: tmp
          emptyDir: {}
