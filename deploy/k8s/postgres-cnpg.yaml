apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openpilot-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie
  bootstrap:
    initdb:
      database: openpilot
      owner: openpilot
  storage:
    # Uses cluster default StorageClass; set storageClass if needed
    # storageClass: standard
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  monitoring:
    enablePodMonitor: true
