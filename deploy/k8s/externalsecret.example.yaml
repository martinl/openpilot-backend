# Example ExternalSecret (External Secrets Operator v1).
# Copy/customize for your ClusterSecretStore, or create the Kubernetes Secret
# `openpilot-secrets` directly with keys:
#   SERVER_SECRET, GITHUB_CLIENT, GITHUB_SECRET, ADMIN_JWT, MAPBOX_TOKEN
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openpilot-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: your-secret-store
    kind: ClusterSecretStore
  target:
    name: openpilot-secrets
    creationPolicy: Owner
  data:
    - secretKey: SERVER_SECRET
      remoteRef:
        key: openpilot/prod
        property: SERVER_SECRET
    - secretKey: GITHUB_CLIENT
      remoteRef:
        key: openpilot/prod
        property: GITHUB_CLIENT
    - secretKey: GITHUB_SECRET
      remoteRef:
        key: openpilot/prod
        property: GITHUB_SECRET
    - secretKey: ADMIN_JWT
      remoteRef:
        key: openpilot/prod
        property: ADMIN_JWT
    - secretKey: MAPBOX_TOKEN
      remoteRef:
        key: openpilot/prod
        property: MAPBOX_TOKEN
