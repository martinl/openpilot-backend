apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openpilot-frontend
spec:
  parentRefs:
    - name: main-gateway
      namespace: kube-system
  hostnames:
    - connect.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: openpilot-frontend
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openpilot-api
spec:
  parentRefs:
    - name: main-gateway
      namespace: kube-system
  hostnames:
    - api.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 600s
        backendRequest: 600s
      backendRefs:
        - name: openpilot-backend
          port: 3112
---
