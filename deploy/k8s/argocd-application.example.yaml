# Example ArgoCD Application pointing to your GitOps overlay.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openpilot
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/your-gitops-repo.git
    targetRevision: HEAD
    path: manifests/openpilot/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: openpilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
