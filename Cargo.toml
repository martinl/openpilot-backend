[package]
name = "connect"
version = "0.1.0"
edition = "2021"
build = "src/build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
migration = { path = "migration" }
sea-orm-migration = { version = "1.1.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
tera = "1.20"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
eyre = "0.6"
tokio = { version = "1.40.0", default-features = false, features = ["time", "process", "io-util", "rt-multi-thread", "macros", "fs", "net", "sync", "signal"] }
async-trait = "0.1.80"
tracing = "0.1.40"
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.21", features = ["derive"] }
sea-orm = { version = "1.1.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-json",
  "with-uuid",
] }
rand = "0.10.4"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
hyper = "1.3.1"
uuid = { version = "1.6.0", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "json"] }
reqwest = { version = "0.13", features = ["stream", "json", "form"] }
dotenvy = "0.15"
bytes = "1.6.0"
regex = "~1.10.4"
capnp = "0.25"
futures = "0.3.30"
async-compression = { version = "0.4.8", features = ["tokio", "bzip2", "zstd"] }
tokio-util = { version = "0.7.10", features = ["io", "rt"] }
url = "2.5.9"
tower-http = { version = "0.6", features = ["normalize-path", "cors", "fs", "trace", "catch-panic", "request-id"] }
tower-layer = "0.3.2"
futures-util = "0.3.30"
tokio-tungstenite = "0.30.0"
cookie = "0.18.1"
jsonwebtoken = { version = "12", features = ["aws_lc_rs"] }
base64 = "0.23.1"
http = "1.1.0"
sha2 = "0.11.1"
hmac = "0.13"
hex = "0.4.3"
thiserror = "2.0"
image = "0.25.1"
axum-server = { version = "0.9", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
rayon = "1.10.0"
tempfile = "3.10.1"
once_cell = "1.19.0"
sysinfo = "0.36.1"
time = "0.3.36"
indicatif = "0.18"
serde_urlencoded = "0.7.1"
governor = "0.10.0"
dashmap = "6.1.0"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

[[bin]]
name = "connect-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
serial_test = "4.0.1"
rstest = "0.28"
insta = { version = "1.34.0", features = ["redactions", "yaml", "filters"] }
criterion = "0.5.1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
capnp = "0.25"
capnpc = "0.25"
# release with optimizations and no debug info

[profile.dev]
opt-level = 0


[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"

debug = false
