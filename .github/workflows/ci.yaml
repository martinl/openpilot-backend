name: CI & Container Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.90.0"
  CC: clang
  CXX: clang++
  RUST_MIN_STACK: "134217728"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Stage 1: Lint, Format, Security Audit, Clippy, and Tests
  # ===========================================================================
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Lint Dockerfile (backend)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint Dockerfile.frontend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.frontend
          failure-threshold: error

      - name: Validate YAML files
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 -c '
          import glob, yaml
          paths = sorted(
              glob.glob(".github/workflows/*.yaml")
              + glob.glob(".github/workflows/*.yml")
              + glob.glob("deploy/**/*.yaml", recursive=True)
              + glob.glob("deploy/**/*.yml", recursive=True)
          )
          for p in paths:
              with open(p, "r", encoding="utf-8") as f:
                  list(yaml.safe_load_all(f))
              print(f"OK: {p}")
          '

      - name: Scan repo for secrets & misconfigurations (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "0"

  rustfmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting on changed Rust files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.rs' || true)
          if [ -z "$FILES" ]; then
            echo "No Rust files changed; skipping rustfmt."
            exit 0
          fi
          echo "$FILES" | xargs rustfmt --edition 2021 --check

  audit:
    name: Security Audit (Cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Generate Cargo.lock if absent
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

  clippy:
    name: Run Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Shallow checkout openpilot submodule (cereal schemas)
        run: |
          git submodule sync --recursive openpilot
          git submodule update --init --recursive --depth 1 openpilot

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libpq-dev libssl-dev \
            libavutil-dev libavformat-dev libavcodec-dev libavdevice-dev \
            libavfilter-dev libswscale-dev libswresample-dev \
            capnproto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo clippy
        run: cargo clippy --all-features

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      redis:
        image: valkey/valkey:9-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - "6379:6379"
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Shallow checkout openpilot submodule (cereal schemas)
        run: |
          git submodule sync --recursive openpilot
          git submodule update --init --recursive --depth 1 openpilot

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev pkg-config libpq-dev libssl-dev \
            libavutil-dev libavformat-dev libavcodec-dev libavdevice-dev \
            libavfilter-dev libswscale-dev libswresample-dev \
            capnproto ffmpeg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --all-features --all
        env:
          REDIS_URL: redis://localhost:${{ job.services.redis.ports[6379] }}
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres_test

  # ===========================================================================
  # Stage 2: Build, Scan & Publish Container Images (only after Stage 1 passes)
  # ===========================================================================
  build-backend:
    name: Build & Push Backend Image
    needs: [lint, rustfmt, audit, clippy, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Shallow checkout openpilot submodule (cereal schemas)
        run: |
          git submodule sync --recursive openpilot
          git submodule update --init --recursive --depth 1 openpilot

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=backend' || '' }}

      - name: Scan backend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ github.event_name != 'pull_request' && format('{0}/{1}/backend@{2}', env.REGISTRY, env.IMAGE_PREFIX, steps.build.outputs.digest) || format('{0}/{1}/backend:{2}', env.REGISTRY, env.IMAGE_PREFIX, steps.meta.outputs.version) }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  build-frontend:
    name: Build & Push Frontend Image
    needs: [lint, rustfmt, audit, clippy, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Shallow checkout frontend submodule
        run: |
          git submodule sync frontend
          git submodule update --init --depth 1 frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=frontend' || '' }}

      - name: Scan frontend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ github.event_name != 'pull_request' && format('{0}/{1}/frontend@{2}', env.REGISTRY, env.IMAGE_PREFIX, steps.build.outputs.digest) || format('{0}/{1}/frontend:{2}', env.REGISTRY, env.IMAGE_PREFIX, steps.meta.outputs.version) }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  build-minikeyvalue:
    name: Build & Push MiniKeyValue Image
    needs: [lint, rustfmt, audit, clippy, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Shallow checkout minikeyvalue submodule
        run: |
          git submodule sync minikeyvalue
          git submodule update --init --depth 1 minikeyvalue

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/minikeyvalue
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push minikeyvalue image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./minikeyvalue
          file: ./minikeyvalue/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=minikeyvalue
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=minikeyvalue' || '' }}

      - name: Scan minikeyvalue image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ github.event_name != 'pull_request' && format('{0}/{1}/minikeyvalue@{2}', env.REGISTRY, env.IMAGE_PREFIX, steps.build.outputs.digest) || format('{0}/{1}/minikeyvalue:{2}', env.REGISTRY, env.IMAGE_PREFIX, steps.meta.outputs.version) }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
