name: CI & Container Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.100.0"
  RUST_MIN_STACK: "134217728"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Stage 1: Lint, Format, Security Audit, Clippy, and Tests
  # ===========================================================================
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint Dockerfile (backend)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint Dockerfile.frontend
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.frontend
          failure-threshold: error

      - name: Validate YAML files
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --quiet pyyaml
          python3 -c '
          import glob, yaml
          paths = sorted(
              glob.glob(".github/workflows/*.yaml")
              + glob.glob(".github/workflows/*.yml")
              + glob.glob("deploy/**/*.yaml", recursive=True)
              + glob.glob("deploy/**/*.yml", recursive=True)
          )
          for p in paths:
              with open(p, "r", encoding="utf-8") as f:
                  list(yaml.safe_load_all(f))
              print(f"OK: {p}")
          '

      - name: Scan repo for secrets & misconfigurations (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "0"

  rustfmt:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting on changed Rust files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.rs' || true)
          if [ -z "$FILES" ]; then
            echo "No Rust files changed; skipping rustfmt."
            exit 0
          fi
          echo "$FILES" | xargs rustfmt --edition 2021 --config skip_children=true --check

  audit:
    name: Security Audit (Cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Generate Cargo.lock if absent
        run: test -f Cargo.lock || cargo generate-lockfile

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

  check-and-test:
    name: Clippy & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shallow checkout openpilot cereal & opendbc_repo schemas
        run: |
          git submodule sync openpilot
          git submodule update --init --depth 1 openpilot
          git -C openpilot submodule sync opendbc_repo
          git -C openpilot submodule update --init --depth 1 opendbc_repo

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          cache-all-crates: "true"

      - name: Run cargo clippy
        run: cargo clippy --all-features

      - name: Run cargo test with coverage
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres_test
        run: |
          cargo llvm-cov --all-features --workspace \
            --ignore-filename-regex 'src/cereal/.*|src/models/_entities/.*' \
            --lcov --output-path lcov.info

      - name: Publish coverage summary & HTML report
        run: |
          {
            echo "### Rust Code Coverage"
            echo '```text'
            cargo llvm-cov report --summary-only \
              --ignore-filename-regex 'src/cereal/.*|src/models/_entities/.*'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --html --output-dir coverage-html \
            --ignore-filename-regex 'src/cereal/.*|src/models/_entities/.*'

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: |
            lcov.info
            coverage-html/
          retention-days: 14

      - name: Enforce minimum line coverage
        run: |
          cargo llvm-cov report --summary-only \
            --ignore-filename-regex 'src/cereal/.*|src/models/_entities/.*' \
            --fail-under-lines 50

      - name: Update coverage badge on master
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo llvm-cov report --json --summary-only \
            --ignore-filename-regex 'src/cereal/.*|src/models/_entities/.*' \
            --output-path coverage-summary.json
          python3 -c '
          import json
          with open("coverage-summary.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          pct = data["data"][0]["totals"]["lines"]["percent"]
          if pct >= 80:
              color = "brightgreen"
          elif pct >= 50:
              color = "green"
          elif pct >= 35:
              color = "yellowgreen"
          elif pct >= 20:
              color = "yellow"
          else:
              color = "orange"
          badge = {
              "schemaVersion": 1,
              "label": "coverage",
              "message": f"{pct:.1f}%",
              "color": color,
          }
          with open("/tmp/coverage.json", "w", encoding="utf-8") as out:
              json.dump(badge, out)
          '
          BADGE_DIR=$(mktemp -d)
          git -C "$BADGE_DIR" init -b badges
          git -C "$BADGE_DIR" config user.name "github-actions[bot]"
          git -C "$BADGE_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/coverage.json "$BADGE_DIR/coverage.json"
          git -C "$BADGE_DIR" add coverage.json
          git -C "$BADGE_DIR" commit -m "ci: update coverage badge"
          git -C "$BADGE_DIR" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$BADGE_DIR" push --force origin badges

  # ===========================================================================
  # Stage 2: Build, Scan & Publish Container Images (only after Stage 1 passes)
  # ===========================================================================
  build-backend:
    name: Build & Push Backend Image
    needs: [lint, rustfmt, audit, check-and-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shallow checkout openpilot cereal & opendbc_repo schemas
        run: |
          git submodule sync openpilot
          git submodule update --init --depth 1 openpilot
          git -C openpilot submodule sync opendbc_repo
          git -C openpilot submodule update --init --depth 1 opendbc_repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Scan backend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  build-frontend:
    name: Build & Push Frontend Image
    needs: [lint, rustfmt, audit, check-and-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shallow checkout frontend submodule
        id: frontend_git
        run: |
          git submodule sync frontend
          git submodule update --init --depth 1 frontend
          echo "sha=$(git -C frontend rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git -C frontend show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VITE_APP_GIT_SHA=${{ steps.frontend_git.outputs.sha }}
            VITE_APP_GIT_TIMESTAMP=${{ steps.frontend_git.outputs.timestamp }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan frontend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  build-minikeyvalue:
    name: Build & Push MiniKeyValue Image
    needs: [lint, rustfmt, audit, check-and-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shallow checkout minikeyvalue submodule
        run: |
          git submodule sync minikeyvalue
          git submodule update --init --depth 1 minikeyvalue

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/minikeyvalue
          tags: |
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push minikeyvalue image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.minikeyvalue
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=minikeyvalue
          cache-to: type=gha,mode=max,scope=minikeyvalue

      - name: Scan minikeyvalue image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/minikeyvalue@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
